## 1DFH = 1u Distance From Home

Il y a donc deux approches ergonomiques :
- historique / **5×6** / Lillian Malt (Kinesis, MoErgo)<br>
  = rendre acceptable les touches excentrées
- moderne / **3×6** / 1DFH (Planck, Atreus, Corne, Ferris…)<br>
  = supprimer les touches excentrées

Aucune des deux n’est utilisable telle quelle en français<br>
  => adaptations requises.

Le 1DFH a un ratio efficacité/complexité imbattable.

**Les hybrides ne fonctionnent pas** : Ergodox-like, 4×6…<br>
L’intérêt est purement marketing (= achat rassurant).

les pré-requis des Poticlaviers

## Tous les caractères sur 30 touches ?

- 26 lettres non accentuées
- 4 touches de ponctuation : <kbd>,;</kbd> <kbd>.:</kbd> <kbd>’!</kbd> <kbd>-?</kbd>
- « 1dk » = touche morte positionnelle <kbd>★</kbd> <br> (change la lettre suivante selon sa position)
  - <kbd>★</kbd> [lettre] = accent grave ou altération (à, è, ù, ç, œ)
  - <kbd>★</kbd> [touche à gauche d’une voyelle] = accent aigu (é)
  - <kbd>★</kbd> [touche sous une voyelle] = circonflexe (â, ê, ŷ, û, î, ô)
  - <kbd>★</kbd> <kbd>★</kbd> [voyelle] = tréma (ä, ë, ÿ, ü, ï, ö)
  - … et d’autres altérations : symboles, tirets, ponctuations…
- 30 symboles en <kbd>AltGr</kbd>

## Quacken

le Poticlavier ultime

---
## Limites du clavier “standard”

- barre d’espace parfois trop grande
  - 5u c’est OK — mais 6.25u non, 7u vraiment pas
  - <kbd>Shift</kbd> et <kbd>Sym</kbd> pourraient être plus confort
- keyboard ghosting
  - certains combos peuvent être bloqués par la membrane
- switches trop durs (hrm)
- géométrie perfectible

Arsenik via Kanata se veut une *bonne* solution sur laptop :

- grâce à la barre d’espace en 5u ;
- pour *la plupart* des utilisateurices.

Pour une *très bonne* solution, il faut un clavier ergonomique.

---
## Géométrie radi(c)ale

Arsenik + ISO est déjà meilleur que la plupart des claviers.
On veut **mieux**.

- taper les mains le plus à plat possible<br>
  => gros stagger vertical + gros splay
- trois bonnes touches par pouce<br>
  => un vrai arc de cercle
- low-profile

Géométrie sans compromis, quitte à être élitiste<br>
=> ajustement millimètre par millimètre !

*« On débute avec Arsenik, on passe au Quacken après. »*
<small>(Ou pas, vu qu’Arsenik est déjà très bien.)</small>

---
## Conçu pour le *group buy*

On compte le fabriquer en nombre pour faire baisser les coûts.
Il faut donc concilier des demandes diverses.

- conception monobloc *splittable*
- configurable en 3×6 ou 3×5
- positions médianes (Hummingbird)
- firmware facile à prise en main :
  - flashage par glisser-déposer (.uf2)
  - personnalisation via ZMK Studio ou GitHub
  - configuration type Arsenik (=> Selenium)

## Le meilleur clavier du monde…

La réception a été (très) enthousiaste :
- la config monobloc a agréablement surpris<br>
    <small>(simple et efficace)</small>
- le combo stagger + splay a été bien ajusté<br>
    <small>(convient à toutes les tailles de mains)</small>
- les touches de pouce tombent sous les doigts
- plus accessible que prévu<br>
    <small>des personnes ont débuté Ergol ou Lafayette avec le Quacken</small>
- les keymaps Selenium font des adeptes hors Quacken

## … mais pas pour tout le monde.

Il est nécessaire (et suffisant) d’**apprendre** :
- une dispo de clavier 1dk (Lafayette, Ergol, Azerty-1dk…)
- une keymap avec des layers (Arsenik, Selenium…)

Inutilisable sans méthode dactylo **stricte**.<br>
<small>Utiliser l’annulaire sur la 5e colonne => échec.</small>

Le clavier est perçu comme trop complexe :
- trop de configurations géométriques<br>
    <small>(Corbeau, Chouette, Huppe…)</small>
- trop de configurations de firmware
- trop peu de touches

# Objectif #2 : QMx2040

faire un clavier pour tout le monde

## Objectif : utilisation immédiate

- dispositions ISO supportée « out of the box »
  - => exit les géométries Malt (5×6) et 1DFH (3×6)
- une seule configuration
  - une seule géométrie
  - un seul firmware
- moins punitif en dactylo approximative

On garde 80 % des objectifs ergonomiques :
- limitation des extensions de doigts
- modifieurs sous les pouces (Shift…)
- touches en colonnes pour favoriser la dactylo stricte

On accepte de bouger **un peu** les mains.

## Un *vrai* clavier ergo

On a supprimé trois anti-patterns :

- pas de flèches en direct (=> layer de navigation)
- pas de Shift sous les auriculaires (=> pouces)
- pas de marquage (=> dactylo requise)

Les points forts :

- ♥️ le clavier ergo le plus simple du monde
- ♥️ les touches de pouce

Le premier hybride Ergo/ISO ?<br>
<small>Le premier clavier ergo 100 % compatible AZERTY/Bépo, en tout cas.</small>

# Modèle économique

 
![Joker](images/joker.jpg)

---
## Cramer le business des claviers à 400 €

Modèle économique des fabricants de claviers ergo :
- vendre du clavier premium plutôt qu’ergo
- proposer des designs rassurants (hybrides, 4×6…)

Exemple-type, le marquage des touches :
- aucun clavier n’a d’intérêt ergo sans dactylo
- quasi aucune marque ne vend de clavier sans marquage

Vécu chez TypeMatrix, constaté partout ailleurs. <br>
<small>(Pire marque : ZSA.)</small>

---
## On propose une *alternative*

- conception avec RP2040 intégré
  - plus complexe que les claviers DIY sur Pro Micro / XIAO
  - mais beaucoup plus économique à produire
- fabrication par lots
  - il faut environ 50 PCB pour faire tomber le coût de production
  - on achète les switches et keycaps par lot aussi
- sans fioriture
  - le clavier est 100 % fonctionnel mais sans boîtier
  - des boîtiers libres sont en cours de conception
- sans but lucratif
  - montage associatif, conception bénévole
  - les gains de chaque lot payent la R&D du modèle suivant
- vente à prix libre

---
## Réparer, Réutiliser, Recycler

Minimaliste mais durable :

- facile à réparer
- les touches du QMx sont réutilisables
- keycaps sans marquage, donc réutilisables
- on recycle tout ce qui est possible
  - expéditions faites avec de la récup
  - les 6e colonnes du Quacken font de jolis porte-clés

---
## Open-Hardware

Le Quacken et le QMx2040 sont libres (GPLv3) :
- géométrie Ergogen
- fichiers de design mécanique (FreeCAD, .dxf)
- fichiers de design électronique (KiCad, Gerber)
- firmware ZMK (Ækeynox)

=> liberté d’utiliser, d’étudier, de modifier et de produire nos claviers.

La limite : on publie les sources *après* avoir « rentabilisé » un design (i.e. livré un lot).

---
